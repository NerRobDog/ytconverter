version: '3.8'

services:
  ytconverter-api:
    build: .
    container_name: ytconverter-api
    ports:
      - "8000:8000"
    environment:
      # Set your API keys here (comma-separated)
      # Leave empty or comment out for open mode (no authentication)
      - YTCONVERTER_API_KEYS=${YTCONVERTER_API_KEYS:-}
    volumes:
      # Mount a local directory for downloads
      - ./downloads:/downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

